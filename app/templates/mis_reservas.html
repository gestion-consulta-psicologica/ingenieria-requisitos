<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis reservas</title></head>
<body>
  <main>
    {% include "cuenta_nav.html" %}
    <h1>Mis reservas</h1>
    <p><a href="/disponibilidad">Consultar disponibilidad</a></p>
    <ul>
      {% for reserva in reservas %}
      <li><a href="/reservas/{{ reserva.id }}">{{ reserva.fecha|fecha_larga }} a las {{ reserva.hora_inicio }}</a> · {{ reserva.estado }}</li>
      {% else %}
      <li>No tienes reservas.</li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
