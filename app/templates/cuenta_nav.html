{% if request.app.state.cuentas_persistentes %}
  {% if request.state.cuenta %}
    {% if request.state.cuenta.rol == "paciente" %}
    <a href="/cuenta/reservas">Mis reservas</a>
    <a href="/cargos">Mis cargos</a>
    {% else %}
    <a href="/psicologa">Panel de la psicóloga</a>
    {% endif %}
    <form method="post" action="/cuenta/salir">
      <input type="hidden" name="csrf" value="{{ request.state.csrf }}">
      <button type="submit">Cerrar sesión</button>
    </form>
  {% else %}
    <a href="/cuenta/ingresar">Ingresar</a>
    <a href="/cuenta/registro">Crear cuenta</a>
  {% endif %}
{% endif %}
