{# Estilos comunes de las pantallas de pago y cargos. #}
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2937; background: #f8fafc; }
    header { background: #0f766e; color: white; padding: 1rem 1.5rem; }
    header h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem 3rem; }
    .rol { color: #d1fae5; font-size: .9rem; }
    section { background: white; border: 1px solid #e2e8f0; border-radius: .5rem; padding: .75rem 1rem; margin-bottom: 1rem; }
    h3 { margin-top: 0; }
    .aviso { background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: .5rem; padding: .75rem 1rem; margin-bottom: 1rem; color: #065f46; }
    .error { background: #fef2f2; border: 1px solid #fca5a5; border-radius: .5rem; padding: .75rem 1rem; margin-bottom: 1rem; color: #991b1b; }
    .detalle { color: #4b5563; font-size: .9rem; }
    label { display: block; font-weight: 600; margin-top: .75rem; }
    input { font: inherit; padding: .45rem .6rem; border: 1px solid #cbd5e1; border-radius: .375rem; width: 100%; max-width: 24rem; box-sizing: border-box; }
    .error-campo { color: #b91c1c; font-size: .9rem; margin: .25rem 0 0; }
    button { font: inherit; padding: .5rem .9rem; border-radius: .375rem; border: 1px solid #0f766e; background: #0f766e; color: white; cursor: pointer; margin-top: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: .5rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    a { color: #0f766e; }
  </style>
